name: Docker Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docker:
    name: Validate Docker Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate docker-compose.yml
        run: |
          docker compose -f docker-compose.yml config
      
      - name: Validate docker-compose.dev.yml
        run: |
          docker compose -f docker-compose.dev.yml config
  
  build-and-test:
    name: Build Docker Images and Run Tests
    runs-on: ubuntu-latest
    needs: validate-docker
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Create .env file
        run: |
          cp .env.example .env
      
      - name: Build production image
        run: |
          docker compose build
      
      - name: Build development image
        run: |
          docker compose -f docker-compose.dev.yml build
      
      - name: Start production container
        run: |
          docker compose up -d
          sleep 10
      
      - name: Test production container health
        run: |
          docker compose ps
          curl -f http://localhost:8000/health || exit 1
      
      - name: Stop production container
        run: |
          docker compose down
      
      - name: Run tests in container
        run: |
          docker compose -f docker-compose.dev.yml run --rm cloudmind-test || true
      
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs
          docker compose -f docker-compose.dev.yml logs
